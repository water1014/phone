name: Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-app
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-android.yml"

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --org com.water1014 --project-name xiaowo .
      - name: Set Android compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          for path in candidates:
              if not path.exists():
                  continue
              source = path.read_text()
              updated = source.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              updated = updated.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              updated = updated.replace("compileSdk flutter.compileSdkVersion", "compileSdk 36")
              if updated == source and "compileSdk" in source:
                  print(f"compileSdk declaration already explicit in {path}; leaving it unchanged")
              else:
                  path.write_text(updated)
                  print(f"Configured compileSdk 36 in {path}")
          if not any(path.exists() for path in candidates):
              raise SystemExit("Android app Gradle file was not generated")
          PY
      - name: Configure stable Android debug signing
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaowo-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
