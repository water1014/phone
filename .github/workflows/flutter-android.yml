name: Flutter Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - feature/flutter-app
    paths:
      - "flutter_app/**"
      - ".github/workflows/flutter-android.yml"

concurrency:
  group: flutter-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android host project
        run: flutter create --platforms=android --org com.water1014 --project-name xiaowo .
      - name: Set Android compile SDK for all modules
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app_candidates = [Path("android/app/build.gradle"), Path("android/app/build.gradle.kts")]
          app_file = next((path for path in app_candidates if path.exists()), None)
          if app_file is None:
              raise SystemExit("Android app Gradle file was not generated")

          source = app_file.read_text()
          replacements = {
              "compileSdk = flutter.compileSdkVersion": "compileSdk = 36",
              "compileSdkVersion flutter.compileSdkVersion": "compileSdkVersion 36",
              "compileSdk flutter.compileSdkVersion": "compileSdk 36",
          }
          for old, new in replacements.items():
              source = source.replace(old, new)
          app_file.write_text(source)
          print(f"Configured app compileSdk 36 in {app_file}")

          PY
      - name: Configure stable Android debug signing
        env:
        env:
          ANDROID_DEBUG_KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::Add the ANDROID_DEBUG_KEYSTORE_BASE64 repository secret before building."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$ANDROID_DEBUG_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
      - name: Install dependencies
        run: flutter pub get
      - name: Patch Android plugin compile SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          cache = Path.home() / ".pub-cache" / "hosted" / "pub.dev"
          patched = []
          if cache.exists():
              for gradle_file in cache.glob("*/android/build.gradle*"):
                  if gradle_file.suffix not in {".gradle", ".kts"}:
                      continue
                  source = gradle_file.read_text()
                  if gradle_file.name.endswith(".kts"):
                      updated = re.sub(
                          r"(?m)^(\\s*)compileSdk(?:Version)?\\s*(?:=\\s*)?.+$",
                          r"\\g<1>compileSdk = 36",
                          source,
                      )
                  else:
                      updated = re.sub(
                          r"(?m)^(\\s*)compileSdk(?:Version)?\\s+.+$",
                          r"\\g<1>compileSdkVersion 36",
                          source,
                      )
                  if updated != source:
                      gradle_file.write_text(updated)
                      patched.append(str(gradle_file))
          print(f"Patched {len(patched)} Android plugin Gradle files to compileSdk 36")
          for path in patched:
              print(path)
          PY
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaowo-flutter-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
