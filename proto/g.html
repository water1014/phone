<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>G · 票据极简</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:#fff;color:#1b1b1b;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 26px 60px;
}
.mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace}
.tag{position:fixed;top:10px;right:16px;font-size:11px;color:#d5d5d5;letter-spacing:2px}

.head{padding:36px 0 0;text-align:center}
.head .b{font-size:11px;letter-spacing:7px;color:#9b9b9b}
.head .t{font-size:13px;margin-top:10px;color:#1b1b1b;letter-spacing:2px}
.head .d{font-size:10px;margin-top:8px;color:#b5b5b5;letter-spacing:1.6px}

.dash{height:1px;margin:20px 0;background:repeating-linear-gradient(90deg,#dcdcdc 0 4px,transparent 4px 8px)}

.amount{text-align:center;padding:10px 0 4px}
.amount .k{font-size:9.5px;letter-spacing:3.4px;color:#b5b5b5}
.amount .n{font-size:76px;font-weight:300;line-height:1;letter-spacing:-4px;margin-top:12px;color:#111}
.amount .u{font-size:10px;letter-spacing:5px;color:#a5a5a5;margin-top:8px}

.items{padding-top:6px}
.it{display:flex;align-items:baseline;font-size:12.5px;padding:9px 0;color:#333}
.it .l{letter-spacing:1px}
.it .dots{flex:1;margin:0 8px;border-bottom:1px dotted #d8d8d8;transform:translateY(-3px)}
.it .r{letter-spacing:.6px;color:#111}

.total{display:flex;justify-content:space-between;font-size:12px;letter-spacing:1px;padding-top:16px;color:#111}

.quote{padding:34px 0 0;font-size:14px;line-height:2.2;color:#4a4a4a}
.quote .s{display:block;margin-top:12px;font-size:10px;letter-spacing:2.6px;color:#c0c0c0}

.foot{margin-top:36px;text-align:center;font-size:9.5px;letter-spacing:3px;color:#c8c8c8}
</style>
</head>
<body>
<div class="tag">G</div>

<header class="head">
  <div class="b">XIAOWO</div>
  <div class="t">在一起的日子</div>
  <div class="d mono">2026.11.20 / 22:57 / 周五</div>
</header>

<div class="dash"></div>

<section class="amount">
  <div class="k">TOTAL DAYS</div>
  <div class="n mono">688</div>
  <div class="u">SINCE 2025.01.01</div>
</section>

<div class="dash"></div>

<section class="items mono">
  <div class="it"><span class="l">日记</span><span class="dots"></span><span class="r">46 篇</span></div>
  <div class="it"><span class="l">相册</span><span class="dots"></span><span class="r">3 张</span></div>
  <div class="it"><span class="l">记忆</span><span class="dots"></span><span class="r">8 条</span></div>
  <div class="it"><span class="l">天气</span><span class="dots"></span><span class="r">雾霾 10°</span></div>
  <div class="it"><span class="l">在听</span><span class="dots"></span><span class="r">水星记</span></div>
</section>

<div class="dash"></div>

<section class="quote">
  今天雾霾，十度。屋里灯开着，等你洗完澡。
  <span class="s">NOTE · 11/20</span>
</section>

<div class="foot">THANK YOU FOR TODAY</div>
</body>
</html>
