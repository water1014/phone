<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>B ·  Magazine 大字</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:#fcfcfc;color:#2b2e32;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 30px 60px;
}
.tag{position:fixed;top:10px;right:16px;font-size:11px;color:#c9d1d7;letter-spacing:2px}

.head{display:flex;justify-content:space-between;align-items:flex-end;padding:34px 0 0}
.head b{font-size:11px;font-weight:400;letter-spacing:4px;color:#b6bec6}
.head span{font-size:12px;color:#a8b2bb;letter-spacing:1px}

.rule{height:1px;background:#e9ecef;margin:16px 0 0}

.hero{padding:54px 0 0}
.hero .k{font-size:11px;letter-spacing:5px;color:#c2cad1}
.hero .big{
  font-size:118px;line-height:.88;font-weight:300;
  letter-spacing:-7px;margin:16px 0 0;color:#1e2125;
}
.hero .big em{font-style:normal;font-size:14px;letter-spacing:4px;color:#aab4bd;margin-left:12px;font-weight:400}
.hero .cap{margin-top:14px;font-size:15px;letter-spacing:1px;color:#8d9aa8}

.body{margin-top:60px;font-size:15.5px;line-height:2.1;color:#4a4e53}
.body .dim{color:#a8b2bb;font-size:13.5px;margin-top:18px;letter-spacing:.4px}

.foot{position:fixed;left:30px;right:30px;bottom:24px;display:flex;justify-content:space-between;
  font-size:11px;letter-spacing:1.6px;color:#c2cad1}
</style>
</head>
<body>
<div class="tag">B</div>

<header class="head">
  <b>XIAOWO</b>
  <span>2026.11.20 周五</span>
</header>
<div class="rule"></div>

<section class="hero">
  <div class="k">TOGETHER</div>
  <div class="big">688<em>DAYS</em></div>
  <div class="cap">宋祁 &amp; 淼淼</div>
</section>

<div class="body">
  今天雾霾，十度，风很小。<br>
  晚上十点五十七，屋里灯开着。
  <div class="dim">已经写了 46 篇日记，存了 3 张照片，记下 8 句话。</div>
</div>

<footer class="foot">
  <span>DIARY</span><span>ALBUM</span><span>MEMORY</span><span>MUSIC</span>
</footer>
</body>
</html>
