<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>F · 拼贴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;background:#f5f6f7;color:#2f3337;
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;padding:0 12px 40px;
}
.tag{position:fixed;top:10px;right:16px;font-size:11px;color:#c9d1d7;letter-spacing:2px}

.top{display:flex;justify-content:space-between;align-items:center;padding:22px 6px 14px}
.top b{font-size:10.5px;font-weight:400;letter-spacing:3.2px;color:#aab3bb}
.top span{font-size:11.5px;color:#98a3ad}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.c{background:#fff;border-radius:20px;padding:16px;box-shadow:0 2px 12px rgba(30,40,50,.05)}
.c .k{font-size:9.5px;letter-spacing:2.4px;color:#b6bec6}

.day{grid-column:1 / -1;display:flex;align-items:flex-end;justify-content:space-between;padding:20px}
.day .n{font-size:56px;font-weight:500;letter-spacing:-2px;line-height:.95;color:#20232a}
.day .n em{font-style:normal;font-size:11px;letter-spacing:3px;color:#a9b3bc;margin-left:6px;font-weight:400}
.day .m{font-size:12px;color:#9aa5b1;letter-spacing:.6px;padding-bottom:6px}

.photo{
  grid-column:1 / -1;height:150px;border-radius:20px;overflow:hidden;position:relative;
  background:linear-gradient(135deg,#dfe6ec,#eef1f4 60%,#e6eaee);
}
.photo .ph{position:absolute;left:16px;bottom:14px;font-size:10px;letter-spacing:2.4px;color:#a8b3bd}
.photo .pl{position:absolute;right:16px;top:14px;font-size:10px;letter-spacing:2px;color:#b6c0c8}

.tall{grid-row:span 2;display:flex;flex-direction:column;justify-content:space-between}
.big{font-size:32px;font-weight:500;letter-spacing:-1px;color:#24272e;margin-top:10px}
.sub{font-size:11.5px;color:#9aa5b1;margin-top:6px;line-height:1.5}

.three{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;grid-column:1 / -1;padding:14px 0}
.three div+div{border-left:1px solid #f0f2f4}
.three b{display:block;font-size:20px;font-weight:500;color:#24272e}
.three i{font-style:normal;display:block;margin-top:6px;font-size:9.5px;letter-spacing:2px;color:#b6bec6}

.list{grid-column:1 / -1;padding:4px 16px}
.li{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid #f2f4f6}
.li:last-child{border-bottom:0}
.li .n{font-size:15px;font-weight:500;color:#33373b}
.li .v{margin-left:auto;font-size:12.5px;color:#8d9aa8}
.li .a{color:#d6dce1;font-size:15px}
</style>
</head>
<body>
<div class="tag">F</div>

<div class="top"><b>XIAOWO</b><span>22:57 · 周五</span></div>

<div class="grid">
  <section class="c day">
    <div>
      <div class="k">TOGETHER</div>
      <div class="n">688<em>DAYS</em></div>
    </div>
    <div class="m">宋祁 &amp; 淼淼</div>
  </section>

  <section class="photo">
    <div class="pl">PHOTO</div>
    <div class="ph">放一张你们的照片</div>
  </section>

  <section class="c tall">
    <div>
      <div class="k">NOW PLAYING</div>
      <div class="big">水星记</div>
      <div class="sub">郭顶 · 只是记下名字</div>
    </div>
    <div class="k">MUSIC</div>
  </section>

  <section class="c">
    <div class="k">WEATHER</div>
    <div class="big">10°</div>
    <div class="sub">雾霾 · 湿度 59%</div>
  </section>

  <section class="c">
    <div class="k">TODAY</div>
    <div class="big">周五</div>
    <div class="sub">11月20日 · 22:57</div>
  </section>

  <section class="c three">
    <div><b>46</b><i>DIARY</i></div>
    <div><b>3</b><i>ALBUM</i></div>
    <div><b>8</b><i>MEMORY</i></div>
  </section>

  <section class="c list">
    <div class="li"><span class="n">日历</span><span class="v">11/20</span><span class="a">›</span></div>
    <div class="li"><span class="n">聊天</span><span class="v">今天</span><span class="a">›</span></div>
  </section>
</div>
</body>
</html>
