<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#050209">
<title>小窝 · 银河</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#050209}
body{font-family:"Noto Serif SC","Songti SC",serif;color:#F3EAF5}
#gl{position:fixed;inset:0;display:block;touch-action:none;width:100%;height:100%}

#glow{position:fixed;inset:0;z-index:2;pointer-events:none;mix-blend-mode:screen}

.head{position:fixed;top:0;left:0;right:0;z-index:10;text-align:center;
  padding:calc(env(safe-area-inset-top) + 14px) 16px 0;pointer-events:none;
  opacity:0;transition:opacity 1.4s ease .4s}
.head.in{opacity:1}
.head h1{font-size:25px;font-weight:400;letter-spacing:.14em;color:#FCF0FA;
  text-shadow:0 0 24px rgba(210,150,230,.5)}
.head .sub{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;
  font-size:12.5px;letter-spacing:.1em;color:rgba(230,205,242,.7);margin-top:5px}
.head .zh{font-size:11.5px;font-weight:300;letter-spacing:.16em;color:rgba(220,205,238,.32);margin-top:10px}

.pal{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 12px);z-index:14;
  width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);display:grid;place-items:center;gap:0;padding:0}
.pal i{display:block;width:13px;height:13px;border-radius:50%;position:absolute;
  transition:background .45s ease}
.pal i:nth-child(1){transform:translate(-4px,-4px)}
.pal i:nth-child(2){transform:translate(4px,4px)}

.palname{position:fixed;right:14px;top:calc(env(safe-area-inset-top) + 56px);z-index:14;
  font-size:10px;letter-spacing:.16em;color:rgba(235,215,240,.5);
  opacity:0;transition:opacity .4s ease;pointer-events:none}
.palname.on{opacity:1}

.back{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:12;
  width:36px;height:36px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.07);color:rgba(240,225,245,.7);font-size:16px;
  text-decoration:none}

.hint{position:fixed;left:50%;transform:translateX(-50%);z-index:7;
  bottom:calc(env(safe-area-inset-bottom) + 20px);
  font-size:10.5px;letter-spacing:.16em;color:rgba(225,205,240,.22);
  white-space:nowrap;pointer-events:none;transition:opacity .8s ease}

#labels{position:fixed;inset:0;z-index:6;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;
  transition:opacity .6s ease;will-change:transform,opacity}
.lbl .t{font-size:11.5px;color:rgba(251,239,250,.92);letter-spacing:.04em;
  text-shadow:0 0 10px rgba(255,180,230,.5),0 1px 4px rgba(0,0,0,.9)}
.lbl .d{font-size:9.5px;color:rgba(230,205,240,.5);letter-spacing:.08em;margin-top:1px;
  text-shadow:0 1px 4px rgba(0,0,0,.9)}

#scrim{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .4s ease}
#scrim.show{opacity:1;pointer-events:auto}

#card{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:54vh;
  display:flex;flex-direction:column;
  padding:36px 24px calc(24px + env(safe-area-inset-bottom));
  background:linear-gradient(to top,rgba(5,2,12,.95) 40%,rgba(5,2,12,.6) 72%,rgba(5,2,12,0));
  opacity:0;transform:translateY(20px);pointer-events:none;
  transition:opacity .5s ease,transform .5s ease}
#card.show{opacity:1;transform:none;pointer-events:auto}
.c-head{display:flex;align-items:baseline;gap:10px;margin-bottom:10px;padding-right:42px}
.c-head b{font-size:15px;font-weight:500;color:#FBEFFA}
.c-head i{font-style:normal;font-family:"Cormorant Garamond",Georgia,serif;
  font-size:13px;letter-spacing:.06em;color:rgba(232,208,244,.75)}
.c-body{font-size:14px;line-height:2.05;color:rgba(244,234,248,.9);
  white-space:pre-wrap;word-break:break-word;overflow-y:auto;-webkit-overflow-scrolling:touch}
.c-close{position:absolute;right:14px;top:8px;width:32px;height:32px;border:0;border-radius:50%;
  background:rgba(255,255,255,.07);color:rgba(230,205,242,.55);font-size:15px;font-family:inherit}

#note{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 64px);z-index:8;
  text-align:center;font-size:11.5px;line-height:2;color:rgba(230,210,240,.42);
  padding:0 36px;display:none;pointer-events:none}
#note.on{display:block}
</style>
</head>
<body>

<canvas id="gl"></canvas>
<div id="glow"></div>
<div id="labels"></div>

<div class="head" id="head">
  <h1>小窝</h1>
  <div class="sub">A constellation of our days</div>
  <div class="zh">这里，是我们一起过掉的日子。</div>
</div>

<button class="pal" id="pal" aria-label="换颜色"><i></i><i></i></button>
<div class="palname" id="palname"></div>

<div class="hint" id="hint">拖动 · 双指缩放 · 点一颗星</div>
<div id="note"></div>

<div id="scrim"></div>
<div id="card">
  <button class="c-close" id="c-close" aria-label="关闭">×</button>
  <div class="c-head"><b id="c-name"></b><i id="c-day"></i></div>
  <div class="c-body" id="c-body"></div>
</div>

<a class="back" href="index.html">←</a>

<script>
(function () {
  'use strict';

  /* ══ 四套颜色 ══ */
  var THEMES = [
    {
      id: 'rose', name: '雾玫瑰',
      cIn: '#F6E2E4', cMid: '#C08F99', cOut: '#7A666E', gold: '#E8C89A',
      dust: ['#E2C4C8', '#A8909A', '#F0D8DC', '#9E8A92', '#E8C89A'],
      dom: { '恋爱': '#E8A6B6', '工程': '#94A2BE', '情绪': '#BCA6CE', '日常': '#A6B6BE' },
      glow: ['255,236,238', '222,170,180', '148,118,128']
    },
    {
      id: 'gold', name: '雾金',
      cIn: '#FFF4E2', cMid: '#DDBB90', cOut: '#86765F', gold: '#F0D0A0',
      dust: ['#E8D0AE', '#B8A686', '#F5E6CC', '#9E8E76', '#F0D0A0'],
      dom: { '恋爱': '#E0B49A', '工程': '#A6A8B8', '情绪': '#C8B090', '日常': '#ACB4AC' },
      glow: ['255,246,230', '232,200,154', '158,138,110']
    },
    {
      id: 'blue', name: '夜灰蓝',
      cIn: '#EDF3FA', cMid: '#9CB0C8', cOut: '#5F7288', gold: '#D8C8A8',
      dust: ['#BCD0E4', '#8EA2BC', '#DCE8F5', '#7E92A8', '#D8C8A8'],
      dom: { '恋爱': '#C8A8C0', '工程': '#8EA8D0', '情绪': '#A898C8', '日常': '#96AEC0' },
      glow: ['238,245,252', '172,194,218', '108,128,152']
    },
    {
      id: 'violet', name: '粉紫（原色）',
      cIn: '#FFDCF2', cMid: '#C891FF', cOut: '#8FB0FF', gold: '#FFCF9A',
      dust: ['#E8B8FF', '#9FB8FF', '#FFD0EC', '#C8A0F0', '#FFE0B0'],
      dom: { '恋爱': '#FF8FD0', '工程': '#8F9FFF', '情绪': '#B48CE8', '日常': '#CFD8F0' },
      glow: ['255,226,246', '234,178,242', '162,126,226']
    }
  ];

  var KIND = [
    ['恋爱', /喜欢|爱|想你|抱|亲亲|陪|一起|老公|老婆|宝宝|暖|甜/],
    ['工程', /代码|前端|仓库|报错|界面|部署|样式|token|api|按钮|页面|字体/i],
    ['情绪', /难|累|哭|烦|怕|难过|委屈|开心|失望|生气/]
  ];

  function kindOf(t) {
    for (var i = 0; i < KIND.length; i++) {
      if (KIND[i][1].test(t)) return KIND[i][0];
    }
    return '日常';
  }

  function pad2(n) { return String(n).padStart(2, '0'); }
  function ymd(d) { return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  function loadStars() {
    var raw = [];
    try { raw = JSON.parse(localStorage.getItem('xw_notes') || '[]'); } catch (e) { raw = []; }
    if (!Array.isArray(raw)) raw = [];

    var out = [];

    raw.forEach(function (it) {
      var text = String((it && it.text) || '');
      if (!text.trim()) return;

      var t = it.t ? Number(it.t) : NaN;
      if (!isFinite(t)) {
        var m = String(it.date || '').match(/(\d{4})-(\d{2})-(\d{2})/);
        t = m ? new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3])).getTime() : Date.now();
      }

      out.push({
        text: text,
        domain: kindOf(text),
        pinned: !!(it && it.pinned),
        t: t,
        day: ymd(new Date(t)),
        name: text.replace(/\s+/g, ' ').slice(0, 14)
      });
    });

    return out;
  }

  var STARS = loadStars();

  /* ══ WebGL ══ */
  var cv = document.getElementById('gl');
  var gl = cv.getContext('webgl', { alpha: false, antialias: false, depth: false, premultipliedAlpha: false });

  if (!gl) {
    document.getElementById('note').className = 'on';
    document.getElementById('note').textContent = '这个浏览器开不了 WebGL。';
    return;
  }

  var W = 0, H = 0, DPR = 1;

  var VS = [
    'attribute vec3 aPos;',
    'attribute vec3 aCol;',
    'attribute float aSize;',
    'attribute float aPh;',
    'uniform mat4 uView;',
    'uniform mat4 uProj;',
    'uniform float uTime;',
    'uniform float uPix;',
    'varying vec3 vCol;',
    'varying float vTw;',
    'void main(){',
    '  vCol = aCol;',
    '  float br = 0.9 + 0.1 * sin(uTime * 0.28 + aPh);',
    '  vTw = br;',
    '  vec4 mv = uView * vec4(aPos, 1.0);',
    '  float dz = max(0.6, -mv.z);',
    '  gl_PointSize = aSize * uPix * br / dz;',
    '  gl_Position = uProj * mv;',
    '}'
  ].join('\n');

  var FS = [
    'precision mediump float;',
    'varying vec3 vCol;',
    'varying float vTw;',
    'void main(){',
    '  float d = length(gl_PointCoord - vec2(0.5));',
    '  float a = smoothstep(0.5, 0.0, d);',
    '  a = pow(a, 1.6) * vTw;',
    '  if (a < 0.012) discard;',
    '  gl_FragColor = vec4(vCol, a);',
    '}'
  ].join('\n');

  function sh(type, src) {
    var s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    return s;
  }

  var prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
  gl.linkProgram(prog);
  gl.useProgram(prog);

  var A = {
    pos: gl.getAttribLocation(prog, 'aPos'),
    col: gl.getAttribLocation(prog, 'aCol'),
    size: gl.getAttribLocation(prog, 'aSize'),
    ph: gl.getAttribLocation(prog, 'aPh')
  };

  var U = {
    view: gl.getUniformLocation(prog, 'uView'),
    proj: gl.getUniformLocation(prog, 'uProj'),
    time: gl.getUniformLocation(prog, 'uTime'),
    pix: gl.getUniformLocation(prog, 'uPix')
  };

  function hex(h) {
    return [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
  }

  var rnd = function (a, b) { return a + Math.random() * (b - a); };
  var pw = function (p) { return Math.pow(Math.random(), p); };
  var sgn = function () { return Math.random() < 0.5 ? 1 : -1; };

  var GAL_R = 5, BRANCHES = 2, SPIN = 1.15, SCAT = 0.55;

  /* ══ 几何只算一次，颜色单独生成 ══ */
  var G = { pos: [], size: [], ph: [], tN: [], isGold: [] };
  var DST = { pos: [], size: [], ph: [], ci: [] };

  (function () {
    for (var i = 0; i < 14000; i++) {
      var r = pw(1.7) * GAL_R;
      var branch = (i % BRANCHES) / BRANCHES * Math.PI * 2;
      var spin = r * SPIN;

      var sx = pw(2.6) * sgn() * SCAT * (r + 0.4);
      var sz = pw(2.6) * sgn() * SCAT * (r + 0.4);
      var sy = pw(3.0) * sgn() * SCAT * 0.34 * (r + 0.3);

      var tN = r / GAL_R;

      G.pos.push(Math.cos(branch + spin) * r + sx, sy, Math.sin(branch + spin) * r + sz);
      G.size.push(rnd(1.4, 5.0) * (tN < 0.3 ? 1.15 : 1));
      G.ph.push(Math.random() * 6.283);
      G.tN.push(tN);
      G.isGold.push(Math.random() < 0.06);
    }

    for (var j = 0; j < 6400; j++) {
      var r2 = pw(1.1) * GAL_R * 1.7 + 0.5;
      var th = Math.random() * Math.PI * 2;

      DST.pos.push(Math.cos(th) * r2, (Math.random() - 0.5) * GAL_R * 1.1, Math.sin(th) * r2);
      DST.size.push(rnd(0.5, 1.8));
      DST.ph.push(Math.random() * 6.283);
      DST.ci.push(Math.floor(Math.random() * 5));
    }
  })();

  /* 记忆星位置 */
  var MEM = [];

  if (STARS.length) {
    var sorted = STARS.slice().sort(function (a, b) { return a.t - b.t; });
    var tA = sorted[0].t;
    var tB = sorted[sorted.length - 1].t;
    var span = Math.max(1, tB - tA);

    sorted.forEach(function (s, i) {
      var tt = (s.t - tA) / span;
      var r = 0.15 + Math.pow(tt, 0.85) * GAL_R * 0.96;
      var branch = (i % BRANCHES) / BRANCHES * Math.PI * 2;
      var spin = r * SPIN;

      var tier = s.pinned ? 2 : 0;

      MEM.push({
        d: s,
        x: Math.cos(branch + spin) * r + rnd(-0.35, 0.35),
        y: rnd(-0.16, 0.16),
        z: Math.sin(branch + spin) * r + rnd(-0.35, 0.35),
        tier: tier,
        size: [5, 9, 12, 13][tier],
        dim: [0.62, 0.85, 1.0, 1.15][tier]
      });
    });

    var c0 = 0;
    MEM.forEach(function (m, i) { if (m.d.t < MEM[c0].d.t) c0 = i; });

    MEM[c0].x = 0;
    MEM[c0].y = 0;
    MEM[c0].z = 0;
    MEM[c0].core = true;
    MEM[c0].tier = 3;
    MEM[c0].size = 13;
    MEM[c0].dim = 1.15;
  }

  /* ══ buffer ══ */
  function mkBuf(n) {
    return { n: n, pos: gl.createBuffer(), col: gl.createBuffer(), size: gl.createBuffer(), ph: gl.createBuffer() };
  }

  function putPosSizePh(b, pos, size, ph) {
    gl.bindBuffer(gl.ARRAY_BUFFER, b.pos);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(pos), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.size);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(size), gl.STATIC_DRAW);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.ph);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(ph), gl.STATIC_DRAW);
  }

  var BP = mkBuf(G.size.length);
  var BD = mkBuf(DST.size.length);
  var BM = MEM.length ? mkBuf(MEM.length) : null;

  putPosSizePh(BP, G.pos, G.size, G.ph);
  putPosSizePh(BD, DST.pos, DST.size, DST.ph);

  if (BM) {
    var mpos = [], msize = [], mph = [];
    MEM.forEach(function (m) {
      mpos.push(m.x, m.y, m.z);
      msize.push(m.size);
      mph.push(Math.random() * 6.283);
    });
    putPosSizePh(BM, mpos, msize, mph);
  }

  /* ══ 上色 ══ */
  function paint(theme) {
    var cIn = hex(theme.cIn), cMid = hex(theme.cMid), cOut = hex(theme.cOut), gold = hex(theme.gold);
    var pc = new Float32Array(G.size.length * 3);

    for (var i = 0; i < G.size.length; i++) {
      var tN = G.tN[i];
      var c;

      if (G.isGold[i]) {
        c = gold;
      } else if (tN < 0.5) {
        var k1 = tN / 0.5;
        c = [cIn[0] + (cMid[0] - cIn[0]) * k1, cIn[1] + (cMid[1] - cIn[1]) * k1, cIn[2] + (cMid[2] - cIn[2]) * k1];
      } else {
        var k2 = Math.min(1, (tN - 0.5) / 0.5);
        c = [cMid[0] + (cOut[0] - cMid[0]) * k2, cMid[1] + (cOut[1] - cMid[1]) * k2, cMid[2] + (cOut[2] - cMid[2]) * k2];
      }

      pc[i * 3] = c[0];
      pc[i * 3 + 1] = c[1];
      pc[i * 3 + 2] = c[2];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, BP.col);
    gl.bufferData(gl.ARRAY_BUFFER, pc, gl.STATIC_DRAW);

    var dc = new Float32Array(DST.size.length * 3);

    for (var j = 0; j < DST.size.length; j++) {
      var c2 = hex(theme.dust[DST.ci[j]]);
      dc[j * 3] = c2[0];
      dc[j * 3 + 1] = c2[1];
      dc[j * 3 + 2] = c2[2];
    }

    gl.bindBuffer(gl.ARRAY_BUFFER, BD.col);
    gl.bufferData(gl.ARRAY_BUFFER, dc, gl.STATIC_DRAW);

    if (BM) {
      var mc = new Float32Array(MEM.length * 3);

      MEM.forEach(function (m, i) {
        var cc = hex(theme.dom[m.d.domain] || theme.dom['日常']);
        mc[i * 3] = cc[0] * m.dim;
        mc[i * 3 + 1] = cc[1] * m.dim;
        mc[i * 3 + 2] = cc[2] * m.dim;
      });

      gl.bindBuffer(gl.ARRAY_BUFFER, BM.col);
      gl.bufferData(gl.ARRAY_BUFFER, mc, gl.STATIC_DRAW);
    }

    document.getElementById('glow').style.background =
      'radial-gradient(circle at 50% 47%,' +
      'rgba(' + theme.glow[0] + ',.20) 0%,' +
      'rgba(' + theme.glow[0] + ',.10) 14%,' +
      'rgba(' + theme.glow[1] + ',.045) 30%,' +
      'rgba(' + theme.glow[2] + ',.015) 48%,' +
      'rgba(0,0,0,0) 66%)';

    var pal = document.getElementById('pal');
    pal.children[0].style.background = theme.cIn;
    pal.children[1].style.background = theme.cMid;

    var nm = document.getElementById('palname');
    nm.textContent = theme.name;
    nm.classList.add('on');
    clearTimeout(nm._t);
    nm._t = setTimeout(function () { nm.classList.remove('on'); }, 1600);

    try { localStorage.setItem('xw_galaxy_theme', theme.id); } catch (e) {}
  }

  function bind(b) {
    gl.bindBuffer(gl.ARRAY_BUFFER, b.pos);
    gl.enableVertexAttribArray(A.pos);
    gl.vertexAttribPointer(A.pos, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.col);
    gl.enableVertexAttribArray(A.col);
    gl.vertexAttribPointer(A.col, 3, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.size);
    gl.enableVertexAttribArray(A.size);
    gl.vertexAttribPointer(A.size, 1, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, b.ph);
    gl.enableVertexAttribArray(A.ph);
    gl.vertexAttribPointer(A.ph, 1, gl.FLOAT, false, 0, 0);
  }

  /* ══ 相机 ══ */
  var FOV = 55 * Math.PI / 180;
  var yaw = 0;
  var pitch = 0.457;
  var dist = 8.4;
  var distTarget = 7.02;

  var view = new Float32Array(16);
  var proj = new Float32Array(16);

  function setView() {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);

    view[0] = cy; view[1] = sp * sy; view[2] = -cp * sy; view[3] = 0;
    view[4] = 0; view[5] = cp; view[6] = sp; view[7] = 0;
    view[8] = sy; view[9] = -sp * cy; view[10] = cp * cy; view[11] = 0;
    view[12] = 0; view[13] = 0; view[14] = -dist; view[15] = 1;
  }

  function setProj() {
    var f = 1 / Math.tan(FOV * 0.5);
    var asp = W / H;
    var near = 0.1, far = 100;

    proj[0] = f / asp; proj[1] = 0; proj[2] = 0; proj[3] = 0;
    proj[4] = 0; proj[5] = f; proj[6] = 0; proj[7] = 0;
    proj[8] = 0; proj[9] = 0; proj[10] = (far + near) / (near - far); proj[11] = -1;
    proj[12] = 0; proj[13] = 0; proj[14] = 2 * far * near / (near - far); proj[15] = 0;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;

    cv.width = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.style.width = W + 'px';
    cv.style.height = H + 'px';

    gl.viewport(0, 0, cv.width, cv.height);

    setProj();
    gl.uniformMatrix4fv(U.proj, false, proj);
    gl.uniform1f(U.pix, DPR * 3.2);
  }

  resize();

  function screenOf(x, y, z) {
    var cy = Math.cos(yaw), sy = Math.sin(yaw);
    var cp = Math.cos(pitch), sp = Math.sin(pitch);

    var X = cy * x + sy * z;
    var Y = sp * sy * x + cp * y - sp * cy * z;
    var Z = -cp * sy * x + sp * y + cp * cy * z - dist;

    if (Z > -0.4) return null;

    var f = 1 / Math.tan(FOV * 0.5);
    var w = -Z;

    return {
      x: ((f / (W / H)) * X / w * 0.5 + 0.5) * W,
      y: (-(f * Y) / w * 0.5 + 0.5) * H,
      z: w
    };
  }

  /* ══ 标签 ══ */
  var labelBox = document.getElementById('labels');
  var labels = [];

  if (MEM.length) {
    MEM.forEach(function (m) {
      if (m.tier < 2 && MEM.length > 30) return;

      var el = document.createElement('div');
      el.className = 'lbl';
      el.style.opacity = '0';
      el.innerHTML = '<div class="t"></div><div class="d"></div>';
      el.querySelector('.t').textContent = m.core ? '开始' : m.d.name;
      el.querySelector('.d').textContent = m.d.day.slice(5);
      labelBox.appendChild(el);

      labels.push({ el: el, m: m });
    });
  } else {
    var note = document.getElementById('note');
    note.className = 'on';
    note.innerHTML = '星云已经在这儿了。<br>写一条记忆，它就亮一颗。';
  }

  /* ══ 交互 ══ */
  var dragging = false;
  var moved = 0;
  var lastX = 0, lastY = 0;
  var picked = -1;

  var card = document.getElementById('card');
  var scrim = document.getElementById('scrim');
  var hint = document.getElementById('hint');

  function openCard(m) {
    picked = MEM.indexOf(m);

    document.getElementById('c-name').textContent = m.core ? '开始' : (m.d.name || '一条记忆');
    document.getElementById('c-day').textContent = m.d.day + (m.d.pinned ? ' · 钉着' : '');
    document.getElementById('c-body').textContent = m.d.text;

    card.classList.add('show');
    scrim.classList.add('show');
    hint.style.opacity = '0';
  }

  function closeCard() {
    card.classList.remove('show');
    scrim.classList.remove('show');
    picked = -1;
    hint.style.opacity = '';
  }

  document.getElementById('c-close').addEventListener('click', closeCard);
  scrim.addEventListener('click', closeCard);

  cv.addEventListener('pointerdown', function (e) {
    dragging = true;
    moved = 0;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  cv.addEventListener('pointermove', function (e) {
    if (!dragging) return;

    var dx = e.clientX - lastX;
    var dy = e.clientY - lastY;

    lastX = e.clientX;
    lastY = e.clientY;

    moved += Math.abs(dx) + Math.abs(dy);

    yaw += dx * 0.006;
    pitch = Math.max(0.02, Math.min(Math.PI * 0.86, pitch - dy * 0.005));
  });

  cv.addEventListener('pointerup', function (e) {
    dragging = false;
    if (moved > 12) return;
    if (!MEM.length) return;

    var best = null;
    var bestZ = 1e9;

    MEM.forEach(function (m) {
      var p = screenOf(m.x, m.y, m.z);
      if (!p) return;

      var dx = p.x - e.clientX;
      var dy = p.y - e.clientY;

      if (dx * dx + dy * dy < 1400 && p.z < bestZ) {
        best = m;
        bestZ = p.z;
      }
    });

    if (best) openCard(best);
    else closeCard();
  });

  cv.addEventListener('pointercancel', function () { dragging = false; });

  var pinch0 = 0, dist0 = 0;

  function span2(t) {
    var a = t[0], b = t[1];
    var dx = a.clientX - b.clientX;
    var dy = a.clientY - b.clientY;
    return Math.sqrt(dx * dx + dy * dy) || 1;
  }

  cv.addEventListener('touchstart', function (e) {
    if (e.touches.length === 2) {
      pinch0 = span2(e.touches);
      dist0 = dist;
      dragging = false;
    }
  }, { passive: true });

  cv.addEventListener('touchmove', function (e) {
    if (e.touches.length === 2 && pinch0) {
      e.preventDefault();
      dist = Math.max(2.4, Math.min(14, dist0 * pinch0 / span2(e.touches)));
      distTarget = dist;
    }
  }, { passive: false });

  cv.addEventListener('touchend', function (e) {
    if (e.touches.length < 2) pinch0 = 0;
  }, { passive: true });

  /* ══ 换色 ══ */
  var ti = 0;

  try {
    var saved = localStorage.getItem('xw_galaxy_theme');
    THEMES.forEach(function (t, i) { if (t.id === saved) ti = i; });
  } catch (e) {}

  paint(THEMES[ti]);

  document.getElementById('pal').addEventListener('click', function () {
    ti = (ti + 1) % THEMES.length;
    paint(THEMES[ti]);
  });

  /* ══ 渲染 ══ */
  var t0 = performance.now();
  var lastT = t0;

  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE);

  function frame(now) {
    requestAnimationFrame(frame);

    var dt = Math.min(0.05, (now - lastT) / 1000);
    lastT = now;

    var t = (now - t0) / 1000;

    if (!dragging && pinch0 === 0) yaw += dt * 0.035;

    if (dist > distTarget) dist = Math.max(distTarget, dist - dt * 12);

    setView();
    gl.uniformMatrix4fv(U.view, false, view);
    gl.uniform1f(U.time, t * 2.0);

    gl.clearColor(0.020, 0.008, 0.036, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);

    bind(BD);
    gl.drawArrays(gl.POINTS, 0, BD.n);

    bind(BP);
    gl.drawArrays(gl.POINTS, 0, BP.n);

    if (BM) {
      bind(BM);
      gl.drawArrays(gl.POINTS, 0, BM.n);
    }

    labels.forEach(function (L) {
      var p = screenOf(L.m.x, L.m.y, L.m.z);

      if (!p || p.x < -60 || p.x > W + 60 || p.y < 60 || p.y > H - 40) {
        L.el.style.opacity = '0';
        return;
      }

      L.el.style.opacity = (picked >= 0 && MEM[picked] !== L.m) ? '0.16' : (L.m.core ? '1' : '0.88');
      L.el.style.left = p.x + 'px';
      L.el.style.top = (p.y + 12) + 'px';
    });
  }

  requestAnimationFrame(frame);

  document.getElementById('head').classList.add('in');

  window.addEventListener('resize', resize);
})();
</script>
</body>
</html>
