<!-- ══ 舞台 ══ -->
<div class="stage">
  <div class="phone" id="phone">
    <div class="screen" id="screen">

      <!-- 壁纸层 -->
      <div class="wallpaper" id="wallpaper">
        <svg class="wall-art" viewBox="0 0 390 844" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <g class="wa-clouds">
            <ellipse cx="90" cy="180" rx="120" ry="42"/><ellipse cx="300" cy="250" rx="150" ry="50"/>
            <ellipse cx="180" cy="410" rx="170" ry="46"/><ellipse cx="330" cy="620" rx="140" ry="44"/>
          </g>
          <g class="wa-hills">
            <path d="M0 640Q90 560 190 620T390 590V844H0z"/>
            <path d="M0 710Q120 640 230 700T390 672V844H0z"/>
          </g>
          <g class="wa-rain">
            <path d="M40 100l-6 18M110 60l-6 18M180 130l-6 18M250 80l-6 18M320 150l-6 18M360 40l-6 18M70 300l-6 18M150 350l-6 18M230 300l-6 18M310 380l-6 18M20 460l-6 18M100 500l-6 18M270 480l-6 18M350 520l-6 18"/>
          </g>
        </svg>
        <div class="wall-grain"></div>
      </div>

      <!-- 状态栏 -->
      <div class="statusbar" id="statusbar">
        <span id="statusTime">9:41</span>
        <span class="sb-right"><svg viewBox="0 0 18 12" width="17" height="11"><path d="M1 9h2v2H1zM5 6.5h2V11H5zM9 4h2v7H9zM13 1.5h2V11h-2z" fill="currentColor"/></svg><svg viewBox="0 0 16 12" width="16" height="11"><path d="M1 4.5a9 9 0 0 1 14 0M3.5 7a5.5 5.5 0 0 1 9 0" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="8" cy="10" r="1.2" fill="currentColor"/></svg><span class="sb-bat"><i></i></span></span>
      </div>

      <!-- 锁屏 -->
      <section class="layer lockscreen" id="lockscreen">
        <div class="lock-clock"><div id="lockTime">9:41</div><div class="lock-date" id="lockDate">11月9日 星期一</div></div>
        <div class="card lock-card" id="lockCard">
          <svg class="sticker card-sticker"><use href="#st-bandaid"/></svg>
          <div class="pair">
            <svg class="avatar av-64" data-av="me"><use href="#av-me"/></svg>
            <svg class="pair-heart"><use href="#st-heart"/></svg>
            <svg class="avatar av-64" data-av="him"><use href="#av-him"/></svg>
          </div>
          <div class="lock-name">Me &amp; 哥哥笨蛋&gt;_&lt;</div>
          <div class="lock-days">在一起 <b id="lockDays">182</b> 天</div>
          <div class="mono lock-since">SINCE 2026.05.11<br>领证 2026.05.13</div>
        </div>
        <div class="lock-foot" id="unlockBtn">
          <div class="pixel-sprite mini" id="lockSprite"></div>
          <div class="unlock-text">上划解锁</div>
          <div class="unlock-arrow">⌃</div>
        </div>
      </section>

      <!-- 主屏 -->
      <section class="layer homelayer" id="homelayer">
        <div class="pages" id="pages">
          <div class="page" id="page0"></div>
          <div class="page" id="page1"></div>
          <div class="page" id="page2"></div>
        </div>
        <div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
      </section>

      <!-- Dock -->
      <nav class="dock" id="dock"></nav>

      <!-- 应用层 -->
      <section class="layer app-layer" id="appLayer">
        <div class="app-shell" id="appShell">
          <header class="app-bar"><button class="bar-back jelly" id="appBack" aria-label="返回"><svg><use href="#i-back"/></svg></button><span id="appTitle"></span><button class="bar-more jelly" id="appMore" aria-label="更多"><svg><use href="#i-more"/></svg></button></header>
          <div class="app-body" id="appBody"></div>
        </div>
      </section>

      <!-- 像素精灵（全局常驻） -->
      <div class="pixel-sprite spirit" id="spirit" title="点我一下"></div>
      <div class="spirit-bubble" id="spiritBubble"></div>
      <div class="home-bar"></div>

      <!-- 通用浮层 -->
      <div class="snackbar" id="snackbar"><span id="snackText"></span><button id="snackAction">撤销</button></div>
      <div class="modal-mask" id="modalMask"><div class="modal card" id="modal"></div></div>
      <div class="drawer-mask" id="drawerMask"><div class="drawer-panel" id="drawerPanel"></div></div>
    </div>
  </div>
  <div class="stage-hint">← 左右滑动主屏 · 点击图标打开应用 →</div>
</div>

<script src="app.js"></script>
