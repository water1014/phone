<script>
(function () {
  var KEY = 'xw_page_ver';
  var mine = document.documentElement.getAttribute('data-ver') || '';
  var busy = false;

  function check() {
    if (busy || !mine) return;
    busy = true;

    fetch('index.html?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.text() : ''; })
      .then(function (html) {
        var m = html && html.match(/<html[^>]*\sdata-ver="([^"]+)"/);
        var live = m ? m[1] : '';
        if (live && live !== mine) {
          try { localStorage.setItem(KEY, live); } catch (e) {}
          location.reload();
          return;
        }
        try { localStorage.setItem(KEY, mine); } catch (e) {}
        busy = false;
      })
      .catch(function () { busy = false; });
  }

  document.addEventListener('visibilitychange', function () {
    if (!document.hidden) check();
  });

  window.addEventListener('pageshow', function (e) {
    if (e.persisted) check();
  });

  setTimeout(check, 1200);
})();
</script>
