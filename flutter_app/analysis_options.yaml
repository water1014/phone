include: package:flutter_lints/flutter.yaml
linter:
  rules:
    avoid_print: true
    prefer_const_constructors: true
    prefer_const_declarations: true
    sort_child_properties_last: true

# Flutter stable 3.50 deprecates the legacy Material library entrypoint;
# keep using the stable cross-platform widget API during this migration.
analyzer:
  errors:
    deprecated_member_use: ignore
